name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install the stable Rust toolchain provided by dtolnay/rust-toolchain.
      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo build artifacts to speed up repeated runs of this workflow.
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features